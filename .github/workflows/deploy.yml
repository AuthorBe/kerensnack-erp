name: Auto Deploy ERP to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Build Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          tar -czf vendor.tar.gz vendor/

      - name: Upload Vendor Archive to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: "vendor.tar.gz"
          target: "/home/kerensna/kerensnack-erp"

      - name: Deploy Code & Extract Vendor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd /home/kerensna/kerensnack-erp

            # 1. Ambil commit terbaru dari GitHub tanpa risiko merge conflict
            git fetch origin main

            # 2. Sinkronkan working tree 100% identik dengan commit GitHub terbaru
            # Catatan: Perintah ini HANYA menyentuh tracked files.
            # File .env, storage/, dan cache/ (di-ignore Git) 100% AMAN & UTUH.
            git reset --hard origin/main

            # 3. Ekstrak arsip vendor hasil build GitHub runner
            if [ -f vendor.tar.gz ]; then
              tar -xzf vendor.tar.gz
              rm -f vendor.tar.gz
            fi

            # 4. Hapus file skema .sql dan dokumentasi .md untuk keamanan server produksi
            # Dilengkapi proteksi: TIDAK menyentuh folder storage maupun vendor
            find . -type f \( -name "*.sql" -o -name "*.md" \) \
              -not -path "./storage/*" \
              -not -path "./vendor/*" \
              -delete

            # 5. Hapus file contoh environment
            rm -f .env.example

            # 6. Pastikan direktori runtime dan cache tetap ada dengan hak akses aman
            mkdir -p storage/logs storage/cache/media cache/rate_limit